<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ title }} · RepoPilot</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script defer src="{{ url_for('static', path='vendor/htmx-2.0.11.min.js') }}"></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  {% include "workspace.html" %}
  <script>
    document.addEventListener("keydown", event => {
      const field = document.querySelector(".header-search input[type=search]");
      if (field && (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        field.focus();
        field.select();
      }
    });
  </script>
</body>
</html>
