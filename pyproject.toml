[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "A local web application for understanding source repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "chromadb>=1.5.9,<2",
    "fastapi>=0.115,<1",
    "filelock>=3.18,<4",
    "httpx2>=2,<3",
    "jinja2>=3.1.6,<4",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.2,<2",
    "markdown-it-py>=3,<5",
    "openai>=2,<4",
    "packaging>=24",
    "protego>=0.7,<1",
    "psutil>=6,<8",
    "python-multipart>=0.0.20,<1",
    "PyYAML>=6,<7",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-toml>=0.7,<0.8",
    "uvicorn>=0.30,<1",
]

[project.scripts]
repopilot = "repopilot.cli:main"

[project.optional-dependencies]
docs = [
    "merm==0.1.5",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "pytest-playwright>=0.7,<1",
    "ruff>=0.11,<1",
    "setuptools>=77",
    "types-PyYAML>=6,<7",
    "types-psutil>=6,<8",
    "starlette>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repopilot = ["templates/*.html", "static/*.css", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["run.py", "src", "tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
